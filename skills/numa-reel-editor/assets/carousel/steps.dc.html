<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{{slide_title}}</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@200..700&amp;family=Nunito+Sans:wght@300..800&amp;display=swap">
<style>
body{margin:0}
a{color:{{color.ink}}}a:hover{color:{{color.ink}}}
</style>
</helmet>
<!--slide-->
<div data-slide="{{component}}" style="width: 1080px; height: 1350px; box-sizing: border-box; padding: 96px 96px 80px; display: flex; flex-direction: column; gap: 48px; overflow: hidden; background: {{color.bg}}; color: {{color.ink}}; font-family: 'Nunito Sans', 'Avenir Next', Avenir, sans-serif">
<div style="display: flex; align-items: center; gap: 18px; height: 40px; flex-shrink: 0">
<div style="width: 48px; height: 4px; flex-shrink: 0; background: {{color.accent}}"></div>
<p data-fit="kicker" style="margin: 0; max-width: 820px; overflow: hidden; white-space: nowrap; font-size: 26px; line-height: 40px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: {{color.ink}}">{{kicker}}</p>
</div>
<div data-fit="content" style="flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; justify-content: center; gap: 56px">
<h2 data-fit="title" style="margin: 0; max-height: 288px; overflow: hidden; font-family: 'Hanken Grotesk', 'Helvetica Neue', Arial, sans-serif; font-size: 92px; line-height: 96px; font-weight: 300; color: {{color.ink}}; letter-spacing: -0.02em; text-wrap: balance">{{title}}</h2>
<div style="display: flex; flex-direction: column; gap: 44px; border-top: 2px solid {{color.rule}}; padding-top: 48px">
<div style="display: flex; align-items: baseline; gap: 36px">
<p style="margin: 0; width: 64px; flex-shrink: 0; font-family: 'Hanken Grotesk', 'Helvetica Neue', Arial, sans-serif; font-weight: 300; font-size: 72px; line-height: 72px; color: {{color.accent}}">1</p>
<p data-fit="step1" style="margin: 0; max-height: 189px; overflow: hidden; font-family: 'Nunito Sans', 'Avenir Next', Avenir, sans-serif; font-size: 46px; line-height: 63px; font-weight: 400; color: {{color.ink}}; text-wrap: pretty; flex: 1; min-width: 0">{{step1}}</p>
</div>
<div style="display: flex; align-items: baseline; gap: 36px">
<p style="margin: 0; width: 64px; flex-shrink: 0; font-family: 'Hanken Grotesk', 'Helvetica Neue', Arial, sans-serif; font-weight: 300; font-size: 72px; line-height: 72px; color: {{color.accent}}">2</p>
<p data-fit="step2" style="margin: 0; max-height: 189px; overflow: hidden; font-family: 'Nunito Sans', 'Avenir Next', Avenir, sans-serif; font-size: 46px; line-height: 63px; font-weight: 400; color: {{color.ink}}; text-wrap: pretty; flex: 1; min-width: 0">{{step2}}</p>
</div>
<div style="display: flex; align-items: baseline; gap: 36px">
<p style="margin: 0; width: 64px; flex-shrink: 0; font-family: 'Hanken Grotesk', 'Helvetica Neue', Arial, sans-serif; font-weight: 300; font-size: 72px; line-height: 72px; color: {{color.accent}}">3</p>
<p data-fit="step3" style="margin: 0; max-height: 189px; overflow: hidden; font-family: 'Nunito Sans', 'Avenir Next', Avenir, sans-serif; font-size: 46px; line-height: 63px; font-weight: 400; color: {{color.ink}}; text-wrap: pretty; flex: 1; min-width: 0">{{step3}}</p>
</div>
<!--if:step4-->
<div style="display: flex; align-items: baseline; gap: 36px">
<p style="margin: 0; width: 64px; flex-shrink: 0; font-family: 'Hanken Grotesk', 'Helvetica Neue', Arial, sans-serif; font-weight: 300; font-size: 72px; line-height: 72px; color: {{color.accent}}">4</p>
<p data-fit="step4" style="margin: 0; max-height: 189px; overflow: hidden; font-family: 'Nunito Sans', 'Avenir Next', Avenir, sans-serif; font-size: 46px; line-height: 63px; font-weight: 400; color: {{color.ink}}; text-wrap: pretty; flex: 1; min-width: 0">{{step4}}</p>
</div>
<!--/if:step4-->
</div>
</div>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 32px; height: 72px; flex-shrink: 0; box-sizing: border-box; border-top: 2px solid {{color.rule}}; padding-top: 26px">
<p style="margin: 0; font-size: 28px; line-height: 44px; font-weight: 400; letter-spacing: 0.02em; color: {{color.ink}}">{{brand_name}}</p>
<p style="margin: 0; font-size: 28px; line-height: 44px; font-weight: 600; letter-spacing: 0.08em; color: {{color.ink}}">{{page}}</p>
</div>
</div>
<!--/slide-->
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1080,"height":1350}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
