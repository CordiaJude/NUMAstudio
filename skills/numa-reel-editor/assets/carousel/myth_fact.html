<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="numa-component" content="myth_fact">
<title>{{slide_title}}</title>
<link rel="stylesheet" href="carousel.css">
</head>
<body>
<!--slide-->
<div data-slide="{{component}}" style="width: 1080px; height: 1350px; box-sizing: border-box; padding: 96px 96px 80px; display: flex; flex-direction: column; gap: 48px; overflow: hidden; background: {{color.cream}}; color: {{color.ink}}; font-family: Inter, system-ui, sans-serif">
<div style="display: flex; align-items: center; gap: 16px; height: 40px; flex-shrink: 0">
<div style="width: 56px; height: 6px; flex-shrink: 0; background: {{color.cedar_ember}}; border-radius: 3px"></div>
<p data-fit="kicker" style="margin: 0; max-width: 820px; overflow: hidden; white-space: nowrap; font-size: 26px; line-height: 40px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: {{color.water_teal}}">{{kicker}}</p>
</div>
<div data-fit="content" style="flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; justify-content: center; gap: 36px">
<div style="display: flex; flex-direction: column; gap: 20px; box-sizing: border-box; padding: 44px 48px; border-radius: 28px; border: 3px solid {{color.water_teal}}">
<p style="margin: 0; font-size: 26px; line-height: 36px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: {{color.water_teal}}">Myth</p>
<p data-fit="myth" style="margin: 0; max-height: 244px; overflow: hidden; font-family: Fraunces, Georgia, serif; font-size: 52px; line-height: 61px; font-weight: 500; color: {{color.ink}}">{{myth}}</p>
</div>
<div style="display: flex; flex-direction: column; gap: 20px; box-sizing: border-box; padding: 44px 48px; border-radius: 28px; background: {{color.caption_gold}}">
<p style="margin: 0; font-size: 26px; line-height: 36px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: {{color.ink}}">Fact</p>
<p data-fit="fact" style="margin: 0; max-height: 305px; overflow: hidden; font-family: Fraunces, Georgia, serif; font-size: 52px; line-height: 61px; font-weight: 600; color: {{color.ink}}">{{fact}}</p>
</div>
</div>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 32px; height: 72px; flex-shrink: 0; box-sizing: border-box; border-top: 2px solid {{color.water_teal}}; padding-top: 26px">
<p style="margin: 0; font-family: Fraunces, Georgia, serif; font-size: 30px; line-height: 44px; color: {{color.water_teal}}">{{brand_name}}</p>
<p style="margin: 0; font-size: 26px; line-height: 44px; font-weight: 600; letter-spacing: 0.08em; color: {{color.cedar_ember}}">{{page}}</p>
</div>
</div>
<!--/slide-->
</body>
</html>
