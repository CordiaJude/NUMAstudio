name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install Python packages
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Cache the speech model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: faster-whisper-small.en-v1

      - name: Unit tests
        run: python -m pytest tests/unit -q

      - name: End-to-end five-folder suite
        run: python tests/run_tests.py

  py310-syntax:
    # Scripts must stay Python 3.10 compatible (spec p.49).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Byte-compile scripts and tests under Python 3.10
        run: python -m compileall -q skills tests
