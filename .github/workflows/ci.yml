name: CI

on:
  push:
  pull_request:

jobs:
  parse:
    # A backslash inside an f-string expression (accepted from Python 3.12 on) once slipped past an
    # ast feature_version=(3, 10) parse on 3.11: feature_version is best-effort and does not reject
    # every newer construct. So parse every .py file with a real Python 3.10 interpreter, before
    # anything is installed. The 3.10 unit-test job below is the authoritative grammar check.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Parse every .py file with Python 3.10
        run: |
          python --version
          python - <<'EOF'
          import ast, pathlib, sys
          assert sys.version_info[:2] == (3, 10), sys.version
          bad = 0
          for p in sorted(pathlib.Path(".").rglob("*.py")):
              if any(part in (".git", "spec", ".venv") for part in p.parts):
                  continue
              try:
                  ast.parse(p.read_text(encoding="utf-8"), filename=str(p))
              except SyntaxError as e:
                  bad += 1
                  print(f"::error file={p},line={e.lineno}::{e.msg} (Python 3.10)")
          sys.exit(1 if bad else 0)
          EOF

      - name: Byte-compile on 3.10
        run: python -m compileall -q skills tests

  unit:
    # Scripts must stay Python 3.10 compatible (spec p.49); this 3.10 job is the authoritative
    # grammar and runtime check, and 3.12 covers newer interpreters.
    needs: parse
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install ffmpeg (Ubuntu's build includes vidstab and flite)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install Python packages (clean install from the requirements files)
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Cache the speech model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: faster-whisper-small.en-v1

      - name: Byte-compile scripts and tests
        run: python -m compileall -q skills tests

      - name: Unit tests
        run: python -m pytest tests/unit -q

  unit-macos:
    # macOS is the primary platform (Katie's Mac, R298): unit tests on Python 3.12 with Homebrew's
    # ffmpeg. The five-folder end-to-end suite runs on Linux only (job below) to keep CI cost down:
    # macOS runners bill at a multiple of Linux minutes, and the unit tests already render short
    # reels, master audio and probe output through the same ffmpeg helper.
    needs: parse
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install ffmpeg (Homebrew)
        run: brew install ffmpeg

      - name: Install Python packages (clean install from the requirements files)
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Cache the speech model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: faster-whisper-small.en-v1

      - name: Unit tests
        run: python -m pytest tests/unit -q

  end-to-end:
    # Milestone M3: the five-folder suite runs on every push (spec p.51). Linux only, by choice: see
    # unit-macos above.
    needs: parse
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install ffmpeg (Ubuntu's build includes vidstab and flite)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install Python packages
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Cache the speech model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: faster-whisper-small.en-v1

      - name: Show ffmpeg filters used by the suite
        run: ffmpeg -hide_banner -filters | grep -E ' (vidstabdetect|flite|ebur128) ' || true

      - name: Five-folder suite (M3)
        run: python tests/run_tests.py --json e2e-results.json

      - name: Keep the results table
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: e2e-results.json
          if-no-files-found: ignore
