name: CI

on:
  push:
  pull_request:

jobs:
  unit:
    # Scripts must stay Python 3.10 compatible (spec p.49); 3.12 covers newer interpreters.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install Python packages
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Byte-compile scripts and tests
        run: python -m compileall -q skills tests

      - name: Unit tests
        run: python -m pytest tests/unit -q

  end-to-end:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install Python packages
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Cache the speech model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: faster-whisper-small.en-v1

      - name: End-to-end five-folder suite
        run: python tests/run_tests.py
