name: CI

on:
  push:
  pull_request:

jobs:
  parse:
    # An f-string that only newer Pythons accept once slipped through: parse every .py file with the
    # Python 3.10 grammar (ast feature_version) on a 3.11 interpreter, before anything is installed.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Parse every .py file as Python 3.10
        run: |
          python - <<'EOF'
          import ast, pathlib, sys
          bad = 0
          for p in sorted(pathlib.Path(".").rglob("*.py")):
              if any(part in (".git", "spec", ".venv") for part in p.parts):
                  continue
              try:
                  ast.parse(p.read_text(encoding="utf-8"), filename=str(p), feature_version=(3, 10))
              except SyntaxError as e:
                  bad += 1
                  print(f"::error file={p},line={e.lineno}::{e.msg} (Python 3.10 grammar)")
          sys.exit(1 if bad else 0)
          EOF

      - name: Byte-compile on 3.11
        run: python -m compileall -q skills tests

  unit:
    # Scripts must stay Python 3.10 compatible (spec p.49); 3.12 covers newer interpreters.
    needs: parse
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install ffmpeg (Ubuntu's build includes vidstab and flite)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install Python packages (clean install from the requirements files)
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Cache the speech model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: faster-whisper-small.en-v1

      - name: Byte-compile scripts and tests
        run: python -m compileall -q skills tests

      - name: Unit tests
        run: python -m pytest tests/unit -q

  end-to-end:
    # Milestone M3: the five-folder suite runs on every push (spec p.51).
    needs: parse
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install ffmpeg (Ubuntu's build includes vidstab and flite)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install Python packages
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Cache the speech model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: faster-whisper-small.en-v1

      - name: Show ffmpeg filters used by the suite
        run: ffmpeg -hide_banner -filters | grep -E ' (vidstabdetect|flite|ebur128) ' || true

      - name: Five-folder suite (M3)
        run: python tests/run_tests.py --json e2e-results.json

      - name: Keep the results table
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: e2e-results.json
          if-no-files-found: ignore
